
﻿<!DOCTYPE html>
<html lang="en">
<head>
  <title> Bootstrap </title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    .btn {
      margin: 5px;
      padding: 10px 20px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      transform: scale(1.1);
      opacity: 0.9;
    }
    .btn-link {
      color: #007bff;
      text-decoration: none;
    }
    .btn-link:hover {
      text-decoration: underline;
      color: #0056b3;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Enhanced Button Styles</h2>
  <button type="button" class="btnbtnbtn-default">Default</button>
  <button type="button" class="btnbtnbtn-primary">Primary</button>
  <button type="button" class="btnbtnbtn-success">Success</button>
  <button type="button" class="btnbtnbtn-info">Info</button>
  <button type="button" class="btnbtnbtn-warning">Warning</button>
  <button type="button" class="btnbtnbtn-danger">Danger</button>
  <button type="button" class="btnbtnbtn-link">Link</button>      
</div>

</body>
</html>
